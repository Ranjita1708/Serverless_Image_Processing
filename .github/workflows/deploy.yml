name: Serverless Image Processing — CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: docker.io
  GATEWAY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/serverless-gateway
  TAG: ${{ github.sha }}

jobs:
  # ===========================================================================
  # Job 1: Run unit tests (mocked MinIO — no live services needed)
  # ===========================================================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pillow minio requests

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ===========================================================================
  # Job 2: Build and push Docker images
  # ===========================================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-22.04
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push FastAPI gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: true
          tags: |
            ${{ env.GATEWAY_IMAGE }}:latest
            ${{ env.GATEWAY_IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Job 3: Deploy OpenFaaS functions
  # ===========================================================================
  deploy:
    name: Deploy OpenFaaS Functions
    runs-on: ubuntu-22.04
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install faas-cli
        run: curl -sL https://cli.openfaas.com | sudo sh

      - name: Pull python3-http template
        run: faas-cli template store pull python3-http

      - name: Build OpenFaaS function images
        run: faas-cli build -f stack.yml

      - name: Push OpenFaaS function images to DockerHub
        run: |
          echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          faas-cli push -f stack.yml

      - name: Login to OpenFaaS gateway
        run: |
          echo -n "${{ secrets.OPENFAAS_PASSWORD }}" | faas-cli login \
            --gateway "${{ secrets.OPENFAAS_GATEWAY }}" \
            --username admin \
            --password-stdin

      - name: Deploy functions to OpenFaaS
        run: |
          faas-cli deploy -f stack.yml \
            --gateway "${{ secrets.OPENFAAS_GATEWAY }}"

      - name: Verify deployment
        run: |
          sleep 10
          faas-cli list --gateway "${{ secrets.OPENFAAS_GATEWAY }}"
