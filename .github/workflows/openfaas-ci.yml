name: OpenFaaS CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install faas-cli
        run: |
          curl -sL https://cli.openfaas.com | sudo sh
          faas-cli template store pull python3-http

      - name: Prepare stack.yml for GHCR
        run: |
          # Convert the image names from local registry to GHCR
          # E.g. 127.0.0.1:5001/fn-image-resize:latest -> ghcr.io/username/fn-image-resize:latest
          sed -i "s|127.0.0.1:5001|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}|g" stack.yml
          cat stack.yml

      - name: Build and Push Functions
        run: |
          # Build all functions in stack.yml
          faas-cli build -f stack.yml
          
          # Push all functions to GHCR
          faas-cli push -f stack.yml

      - name: Deployment Instructions
        run: |
          echo "✅ Images successfully built and pushed to GHCR!"
          echo "To deploy to your local WSL environment, run the following command on your laptop:"
          echo "faas-cli deploy -f stack.yml --replace=false"
